[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-air"
version = "0.1.0"
description = "Local-first incident review engine with replay evaluation and user-facing service surfaces."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Doeon Kim", email = "ehdjs1351@gmail.com"}]
license = "MIT"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.27.0.post1",
  "prometheus-fastapi-instrumentator==6.1.0",
  "requests==2.34.2",
  "httpx==0.26.0",
  "pydantic==2.12.5"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0"
]

[tool.setuptools.packages.find]
include = ["aegis_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Repository = "https://github.com/KIM3310/Aegis-Air"
